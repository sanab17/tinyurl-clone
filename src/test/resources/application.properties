# Server configuration
server.port=8080

# Database Configuration (H2 In-Memory for Testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keep Thymeleaf templates fresh during development
spring.thymeleaf.cache=false

# Rate limiting configuration
app.rate-limit.requests-per-minute=20
app.rate-limit.refill-duration=PT1M
app.rate-limit.endpoint=/dashboard/create
