# Server configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

# Keep Thymeleaf templates fresh during development
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# Rate limiting configuration
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
app.rate-limit.refill-duration=${RATE_LIMIT_REFILL_DURATION:PT1M}
app.rate-limit.endpoint=${RATE_LIMIT_ENDPOINT:/dashboard/create}