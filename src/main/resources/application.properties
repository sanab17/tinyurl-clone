# -----------------------------
# Server configuration
# -----------------------------
server.port=${PORT:${SERVER_PORT:8080}}

# -----------------------------
# Spring Profiles
# -----------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# -------------------------------------
# Database Configuration (PostgreSQL)
# -------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:urlshortener}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}

# -----------------------------
# JPA Hibernate Configuration
# -----------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------
# Rate limiting configuration
# -----------------------------
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
app.rate-limit.refill-duration=${RATE_LIMIT_REFILL_DURATION:PT1M}
app.rate-limit.endpoint=${RATE_LIMIT_ENDPOINT:/dashboard/create}

# -----------------------------
# Health configuration
# -----------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never