<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request - AetherLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center; max-width: 480px; padding: 40px;">
            <div class="auth-header" style="margin-bottom: 24px;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 20px;">
                    <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h1 style="font-size: 2rem; margin-bottom: 12px; color: var(--danger);">400 Bad Request</h1>
                <p style="font-size: 1.1rem; line-height: 1.6; color: var(--text-secondary);" th:text="${errorMessage != null ? errorMessage : 'We couldn''t process this request. Please make sure the input data is correct and try again.'}">We couldn't process this request. Please make sure the input data is correct and try again.</p>
            </div>
            <a th:href="@{/dashboard}" class="btn btn-primary" style="display: inline-block; padding: 12px 28px; font-weight: 600;">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
