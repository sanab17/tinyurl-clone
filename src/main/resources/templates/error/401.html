<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 Unauthorized - AetherLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center; max-width: 480px; padding: 40px;">
            <div class="auth-header" style="margin-bottom: 24px;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 20px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h1 style="font-size: 2rem; margin-bottom: 12px; color: var(--accent-blue);">401 Unauthorized</h1>
                <p style="font-size: 1.1rem; line-height: 1.6; color: var(--text-secondary);" th:text="${errorMessage != null ? errorMessage : 'You need to log in to access this page.'}">You need to log in to access this page.</p>
            </div>
            <a th:href="@{/login}" class="btn btn-primary" style="display: inline-block; padding: 12px 28px; font-weight: 600;">Go to Login</a>
        </div>
    </div>
</body>
</html>
